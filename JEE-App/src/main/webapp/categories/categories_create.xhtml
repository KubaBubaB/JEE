<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewAction action="#{categoryCreate.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <f:loadBundle var="msg" basename="ekstra.jest.JEE.view.i18n.messages"/>
        <article>
            <header><h2>#{msg.catCreate}</h2></header>
            <h:form styleClass="container" onreset="onReset()" enctype="multipart/form-data">

                <div class="row">
                    <div class="col-4 p-2">
                        <div class="form-outline">
                            <h:inputText id="name" value="#{categoryCreate.category.name}" styleClass="form-control"/>
                            <h:outputLabel for="name" value="#{msg.name}" styleClass="form-label"/>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-4 p-2">
                        <div class="form-outline">
                            <ui:repeat value="#{categoryCreate.isTrendyValues}" var="isTrendyValue">
                                <div class="form-check">
                                    <h:selectOneRadio id="radioId0" group="isTrendyValue"
                                                      value="#{categoryCreate.category.isTrendy}"
                                                      styleClass="form-check-input"
                                                      enabledClass="form-check-label">
                                        <f:selectItem itemValue="#{isTrendyValue}" itemLabel="#{isTrendyValue}"/>
                                    </h:selectOneRadio>
                                </div>
                            </ui:repeat>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-4 p-2">
                        <fieldset>
                            <legend class="form-label fs-6">#{msg.whereWear}</legend>
                            <ui:repeat value="#{categoryCreate.whereWearClothings}" var="whereWearClothing">
                                <div class="form-check">
                                    <h:selectOneRadio id="radioId" group="whereWearClothing"
                                                      value="#{categoryCreate.category.whereWearClothing}"
                                                      styleClass="form-check-input"
                                                      enabledClass="form-check-label">
                                        <f:selectItem itemValue="#{whereWearClothing}" itemLabel="#{whereWearClothing}"/>
                                    </h:selectOneRadio>
                                </div>
                            </ui:repeat>
                        </fieldset>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn btn-primary" value="#{msg.create}"
                                         action="#{categoryCreate.saveAction()}"/>
                    </div>
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn btn-secondary" value="#{msg.cancel}"
                                         action="#{categoryCreate.cancelAction()}"/>
                    </div>
                </div>
            </h:form>
        </article>
    </ui:define>

</ui:composition>
