<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{categoryEdit.categoryId}" required="true"/>
        <f:viewAction action="#{categoryEdit.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2>Edit category #{categoryEdit.category.name}</h2></header>
            <h:form styleClass="container" onreset="onReset()" enctype="multipart/form-data">

                <div class="row">
                    <div class="col-4 p-2">
                        <div class="form-outline">
                            <ui:repeat value="#{categoryEdit.isTrendyValues}" var="isTrendyValue">
                                <div class="form-check">
                                    <h:selectOneRadio id="radioId0" group="isTrendyValue"
                                                      value="#{categoryEdit.category.isTrendy}"
                                                      styleClass="form-check-input"
                                                      enabledClass="form-check-label">
                                        <f:selectItem itemValue="#{isTrendyValue}" itemLabel="#{isTrendyValue}"/>
                                    </h:selectOneRadio>
                                </div>
                            </ui:repeat>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn btn-primary" value="Update"
                                         action="#{categoryEdit.saveAction()}"/>
                    </div>
                </div>
            </h:form>
        </article>
    </ui:define>

</ui:composition>
