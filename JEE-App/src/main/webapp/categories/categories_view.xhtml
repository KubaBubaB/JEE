<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{categoryView.categoryId}" required="true"/>
    </f:metadata>

    <ui:define name="content">
        <article class="text--justified">
            <header><h:outputText value="#{categoryView.name}"/></header>

            <h:dataTable value="#{categoryView.piecesOfClothing.pieces}" var="pieceOfClothing"
                         styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">

                <h:column>
                    <f:facet name="header">Name</f:facet>
                    <h:outputText value="#{pieceOfClothing.name}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">Size</f:facet>
                    <h:outputText value="#{pieceOfClothing.size}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">Resell price</f:facet>
                    <h:outputText value="#{pieceOfClothing.resellPrice}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">Name of the owner::</f:facet>
                    <h:outputText value="#{pieceOfClothing.nameOfOwner}"/>
                </h:column>

                <h:column>
                    <h:link outcome="/pieces/pieces_view.xhtml" value="View">
                        <f:param name="id" value="#{pieceOfClothing.id}"/>
                    </h:link>
                    <f:facet name="header">View</f:facet>
                </h:column>

                <h:column>
                    <f:facet name="header">Edit</f:facet>
                    <h:link outcome="/pieces/pieces_edit.xhtml" value="Edit">
                        <f:param name="id" value="#{pieceOfClothing.id}"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Delete</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="Delete" action="#{categoryView.deleteAction(pieceOfClothing)}"/>
                    </h:form>
                </h:column>

                <f:facet name="footer">
                    <h:button styleClass="btn" outcome="/pieces/pieces_create.xhtml"
                              value="Create new piece"/>
                </f:facet>
            </h:dataTable>
        </article>
    </ui:define>

</ui:composition>
